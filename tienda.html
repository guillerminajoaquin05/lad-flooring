<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda Online — Lad Flooring</title>
<meta name="description" content="Productos Bona originales para el cuidado y mantenimiento de pisos de madera: limpiadores, aceites, mopas y accesorios.">
<meta property="og:title" content="Tienda Online — Lad Flooring">
<meta property="og:description" content="Productos Bona originales para el cuidado y mantenimiento de pisos de madera.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ladflooring.com/tienda.html">
<meta property="og:image" content="https://ladflooring.com/assets/img/living-piso-natural.jpeg">
<link rel="icon" href="assets/img/logo-mark.svg">
<link rel="stylesheet" href="css/style.css">
<style>
  .sort-wrap { position: relative; flex-shrink: 0; }
  .sort-btn {
    width: 42px; height: 42px; border-radius: var(--radius-full);
    border: 1px solid var(--border); background: var(--white); color: var(--navy);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .sort-btn:hover { border-color: var(--steel-blue); }
  .sort-menu {
    display: none; position: absolute; right: 0; top: 50px; z-index: 20;
    background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-sm);
    box-shadow: var(--shadow-card); min-width: 210px; overflow: hidden;
  }
  .sort-menu.open { display: block; }
  .sort-menu button {
    display: block; width: 100%; text-align: left; padding: 12px 16px;
    border: none; background: none; font-family: var(--font-serif); font-size: 0.9rem;
    color: var(--navy); cursor: pointer; border-bottom: 1px solid var(--border);
  }
  .sort-menu button:last-child { border-bottom: none; }
  .sort-menu button:hover { background: var(--bg); }
  .sort-menu button.active { color: var(--gold); font-weight: bold; }
  .shop-toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: var(--space-4); }
  .shop-toolbar .tag-filters { margin-bottom: 0; }
  @media (max-width: 600px) {
    .shop-section { padding-top: var(--space-3); }
    .shop-toolbar { flex-wrap: nowrap; gap: 8px; margin-bottom: var(--space-3); }
    .shop-toolbar .tag-filters { flex: 1; min-width: 0; gap: 6px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .shop-toolbar .tag-filters::-webkit-scrollbar { display: none; }
    .shop-toolbar .tag-filters button { white-space: nowrap; padding: 8px 12px; }
    #productGrid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    #productGrid .card-img { height: 150px; }
    #productGrid .card-body { padding: 12px 12px 8px; }
    #productGrid .card-body h3 { font-size: 0.95rem; line-height: 1.3; }
    #productGrid .card-footer { flex-direction: column; align-items: stretch; padding: 0 12px 12px; gap: 8px; }
    #productGrid .price { font-size: 1.05rem; }
    #productGrid .card-footer .btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body data-page="tienda">

<div id="lad-header"></div>

<section class="section-tight bg-cream text-center section-decorated">
  <div class="bg-blob" style="width:320px;height:320px;top:-110px;left:12%;background:var(--gold);opacity:0.5;"></div>
  <div class="bg-blob" style="width:260px;height:260px;bottom:-120px;right:10%;background:var(--steel-blue);opacity:0.45;"></div>
  <div class="container">
    <span class="eyebrow">Tienda online</span>
    <h1>Productos destacados</h1>
    <p style="max-width:600px;margin:0 auto;">Desde los mejores productos de cuidado hasta el piso que querés instalar.</p>
  </div>
</section>

<section class="section shop-section">
  <div class="container">
    <div class="shop-toolbar">
      <div class="tag-filters" id="tagFilters">
        <button data-line="todos" class="active">Todos</button>
        <button data-line="bona">Línea Bona</button>
        <button data-line="flotantes">Pisos Flotantes</button>
      </div>
      <div class="sort-wrap">
        <button class="sort-btn" id="sortBtn" title="Ordenar" aria-label="Ordenar">☰</button>
        <div class="sort-menu" id="sortMenu">
          <button data-sort="relevancia" class="active">Relevancia</button>
          <button data-sort="precio-asc">Precio: menor a mayor</button>
          <button data-sort="precio-desc">Precio: mayor a menor</button>
        </div>
      </div>
    </div>
    <div class="grid grid-4" id="productGrid"></div>
  </div>
</section>

<div id="lad-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/common.js"></script>
<script>
  let currentLine = 'todos';
  let currentSort = 'relevancia';

  function sortProducts(products) {
    const sorted = products.slice();
    if (currentSort === 'precio-asc') sorted.sort((a, b) => a.price - b.price);
    else if (currentSort === 'precio-desc') sorted.sort((a, b) => b.price - a.price);
    // "relevancia" ya viene ordenado por familia + nombre desde ladGetProducts()
    return sorted;
  }

  async function renderProducts() {
    const grid = document.getElementById('productGrid');
    grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#8199a3;">Cargando productos...</p>';
    const products = sortProducts(await ladGetProducts({ line: currentLine }));
    if (products.length === 0) {
      grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#8199a3;">No hay productos en esta categoría por el momento.</p>';
      return;
    }
    grid.innerHTML = products.map(p => `
      <div class="card">
        <a href="producto.html?id=${p.id}"><div class="card-img ph ${ladImgClass(p.img)}" style="${ladImgBg(p.img)}"></div></a>
        <div class="card-body">
          ${p.usageTier ? `<span class="badge badge-outline">${LAD_TIER_LABELS[p.usageTier] || p.usageTier}</span>` : ''}
          <h3 style="margin-top:8px;"><a href="producto.html?id=${p.id}">${p.name}</a></h3>
        </div>
        <div class="card-footer">
          ${ladIsConsultOnly(p) ? `
          <span class="price-consult">Precio a consultar</span>
          ${ladConsultButtonHTML(p)}` : `
          <span>
            ${p.oldPrice ? `<span class="price-old">${ladFormatPrice(p.oldPrice)}</span>` : ''}
            <span class="price">${ladFormatPrice(p.price)}</span>
          </span>
          <button class="btn btn-primary btn-sm" onclick="ladAddToCart('${p.id}'); this.textContent='Agregado ✓'; setTimeout(()=>this.textContent='Agregar',1200);">Agregar</button>`}
        </div>
      </div>
    `).join('');
  }

  document.querySelectorAll('#tagFilters button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#tagFilters button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentLine = btn.dataset.line;
      renderProducts();
    });
  });

  const sortBtn = document.getElementById('sortBtn');
  const sortMenu = document.getElementById('sortMenu');
  sortBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    sortMenu.classList.toggle('open');
  });
  document.addEventListener('click', () => sortMenu.classList.remove('open'));
  document.querySelectorAll('#sortMenu button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#sortMenu button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentSort = btn.dataset.sort;
      sortMenu.classList.remove('open');
      renderProducts();
    });
  });

  const params = new URLSearchParams(window.location.search);
  currentLine = params.get('linea') || 'todos';
  document.querySelectorAll('#tagFilters button').forEach(b => {
    b.classList.toggle('active', b.dataset.line === currentLine);
  });
  renderProducts();
</script>
</body>
</html>
