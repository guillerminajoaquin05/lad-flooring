<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Servicio — Lad Flooring</title>
<meta name="description" id="metaDescription" content="Conocé este servicio de Lad Flooring para pisos de madera.">
<meta property="og:title" id="ogTitle" content="Servicio — Lad Flooring">
<meta property="og:description" id="ogDescription" content="Conocé este servicio de Lad Flooring para pisos de madera.">
<meta property="og:type" content="website">
<meta property="og:image" id="ogImage" content="https://ladflooring.com/assets/img/living-piso-natural.jpeg">
<link rel="icon" href="assets/img/logo-mark.svg">
<link rel="stylesheet" href="css/style.css">
<style>
  #serviceDetail > div { min-width: 0; }
  @media (max-width: 600px) {
    #serviceDetail .btn-lg { white-space: normal; text-align: center; width: 100%; justify-content: center; padding: 14px 20px; }
  }
</style>
</head>
<body data-page="servicios">

<div id="lad-header"></div>

<div class="container">
  <div class="breadcrumb"><a href="index.html">Inicio</a> / <a href="servicios.html">Servicios</a> / <span id="crumbName">Servicio</span></div>
</div>

<section class="section-tight">
  <div class="container">
    <div id="serviceDetail" class="grid grid-2" style="gap:48px;align-items:start;"></div>
  </div>
</section>

<section class="section-tight" id="usageInfoSection" style="display:none;padding-top:0;">
  <div class="container" style="max-width:900px;">
    <div class="divider" style="margin-top:0;"></div>
    <h3>Información adicional</h3>
    <div id="usageInfoText"></div>
  </div>
</section>

<section class="section bg-cream">
  <div class="container">
    <div class="section-header">
      <span class="eyebrow">Otros servicios</span>
      <h2>También te puede interesar</h2>
    </div>
    <div class="grid grid-3" id="relatedServices"></div>
  </div>
</section>

<div id="lad-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/products.js"></script>
<script src="js/services.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/common.js"></script>
<script>
(async () => {
  const params = new URLSearchParams(window.location.search);
  const service = await ladGetServiceById(params.get('id')) || (await ladGetServices())[0];

  document.title = service.name + ' — Lad Flooring';
  document.getElementById('crumbName').textContent = service.name;
  const serviceSummary = (service.shortDescription || service.description || '').slice(0, 155);
  document.getElementById('metaDescription').setAttribute('content', serviceSummary);
  document.getElementById('ogTitle').setAttribute('content', service.name + ' — Lad Flooring');
  document.getElementById('ogDescription').setAttribute('content', serviceSummary);
  if (ladIsImageUrl(service.img)) document.getElementById('ogImage').setAttribute('content', service.img);

  document.getElementById('serviceDetail').innerHTML = `
    <div>
      ${ladIsImageUrl(service.img)
        ? `<img class="service-main-photo" id="mainImage" src="${service.img}" alt="${service.name}">`
        : `<div class="ph service-photo ${ladImgClass(service.img)}" id="mainImage" style="height:420px;border-radius:var(--radius-lg);${ladImgBg(service.img)}">
            <span class="ph-tag">Foto: ${service.name.toLowerCase()}</span>
          </div>`}
      <div class="gallery-thumbs" id="galleryThumbs" style="display:none;"></div>
    </div>
    <div>
      ${service.categories.map(c => `<span class="badge badge-outline">${ladServiceCategoryLabel(c)}</span>`).join(' ')}
      <h1 style="margin-top:14px;">${service.name}</h1>
      <p style="white-space:pre-line;">${service.description}</p>
      <h4>¿Qué incluye?</h4>
      <ul class="includes-list">
        ${service.includes.map(item => `<li>${item}</li>`).join('')}
      </ul>
      <div class="divider"></div>
      <a href="cotizacion.html?modulo=${encodeURIComponent(service.categories.includes('Outdoors') ? 'Exteriores / Decks' : (service.categories[0] || ''))}" class="btn btn-primary btn-lg" style="margin-top:8px;">Solicitar cotización para este servicio</a>
    </div>
  `;

  if (service.usageInfo && service.usageInfo.trim()) {
    document.getElementById('usageInfoText').innerHTML = ladRenderUsageList(service.usageInfo);
    document.getElementById('usageInfoSection').style.display = 'block';
  }

  const galleryRows = await ladGetServiceImages(service.id);
  const galleryPhotos = [{ image_url: service.img }, ...galleryRows].filter(g => ladIsImageUrl(g.image_url));
  if (galleryPhotos.length > 1) {
    const galleryMount = document.getElementById('galleryThumbs');
    galleryMount.style.display = 'flex';
    galleryMount.innerHTML = galleryPhotos.map((g, i) => `
      <div class="gallery-thumb service-photo ${i === 0 ? 'active' : ''}" style="background-image:url('${g.image_url.replace(/'/g, "%27")}');" data-url="${g.image_url}"></div>
    `).join('');
    galleryMount.querySelectorAll('.gallery-thumb').forEach(thumb => {
      thumb.addEventListener('click', () => {
        galleryMount.querySelectorAll('.gallery-thumb').forEach(t => t.classList.remove('active'));
        thumb.classList.add('active');
        document.getElementById('mainImage').src = thumb.dataset.url;
      });
    });
  }

  const allServices = await ladGetServices();
  document.getElementById('relatedServices').innerHTML = allServices
    .filter(s => s.id !== service.id)
    .slice(0, 3)
    .map(s => `
      <div class="card">
        <a href="servicio.html?id=${s.id}"><div class="card-img ph service-photo ${ladImgClass(s.img)}" style="${ladImgBg(s.img)}"></div></a>
        <div class="card-body">
          <div class="service-tags">${s.categories.map(c => `<span class="badge badge-outline badge-sm">${ladServiceCategoryLabel(c)}</span>`).join('')}</div>
          <h3 style="margin-top:10px;"><a href="servicio.html?id=${s.id}">${s.name}</a></h3>
          <p>${s.shortDescription}</p>
        </div>
        <div class="card-footer">
          <a href="servicio.html?id=${s.id}" class="btn btn-outline btn-sm" style="color:var(--navy);border-color:var(--navy);">Ver más</a>
        </div>
      </div>
    `).join('');
})();
</script>
</body>
</html>
