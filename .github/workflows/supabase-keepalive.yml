name: Mantener Supabase activo

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: js/supabase-config.js
          sparse-checkout-cone-mode: false
      - name: Consultar la base
        run: |
          KEY="$(grep -oE 'sb_publishable_[A-Za-z0-9_-]+' js/supabase-config.js | head -1)"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pdogvswdhqioarkpppua.supabase.co/rest/v1/products?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Respuesta de Supabase: $code"
          test "$code" = "200"
